name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Build APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: swis-controller-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  linux-prepair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: python3 -m unittest discover -s tools/prepair -v
      - name: Build single-file installer
        run: |
          bash -n tools/prepair/install.sh
          tools/prepair/bundle.sh build/swis-prepair-install.sh
      - uses: actions/upload-artifact@v4
        with:
          name: swis-prepair-linux-installer
          path: build/swis-prepair-install.sh
